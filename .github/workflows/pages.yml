name: Publicar en Pages

# Pages en modo "legacy" (desde la rama) no reconstruyó en todos los push
# (BUGS.md): con este workflow cada push a main publica, y si falla se ve en Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (solo lo que se sirve)
        run: |
          mkdir _sitio
          cp -r index.html manifest.webmanifest sw.js css js icons fonts .nojekyll _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
