<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estados rápidos">
  <!-- Identidad "Organic Minimalist" (reskin 2026-09-28): colores planos de css/estilos.css
       (--color-primario / --color-acento), sin degradé (regla de UI 4, sin gradientes
       decorativos). Anillo segmentado (como el de "estado" de WhatsApp) en verde ciprés. -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#3a4d39" stroke-width="6"
    stroke-linecap="round" stroke-dasharray="27 14" transform="rotate(-90 32 32)" />
  <!-- Rayo (rápido) en el centro, en umber (acento) para diferenciarse del anillo sin degradé -->
  <path d="M34 12 L18 34 L28 34 L26 52 L46 28 L35 28 Z" fill="#6e5b49" />
</svg>
