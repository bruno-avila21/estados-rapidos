<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estados rápidos">
  <defs>
    <linearGradient id="ergrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Anillo segmentado (como el de "estado" de WhatsApp), degradé azul→violeta -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ergrad)" stroke-width="6"
    stroke-linecap="round" stroke-dasharray="27 14" transform="rotate(-90 32 32)" />
  <!-- Rayo (rápido) en el centro, mismo degradé -->
  <path d="M34 12 L18 34 L28 34 L26 52 L46 28 L35 28 Z" fill="url(#ergrad)" />
</svg>
